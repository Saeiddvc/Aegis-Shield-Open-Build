name: Vara Smart VPN 4.5.7 Public Build Shell
# Signed update gate: stable Vara field-test certificate + runtime/update verification.

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/vara-457-open-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AAR_URL: https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar
      AAR_SHA256: a6b51b525b72a114c10e34288392439b1897c9ff7ce2f8afd7ffdce9d91e93b3
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS_VERSION: 36.0.0
      EXPECTED_SIGN_CERT_SHA256: D3:CD:CB:AA:0C:30:D9:21:4F:F6:CA:B5:DD:75:C5:E5:FF:75:C4:AE:57:4D:39:9E:8E:96:BF:CC:1C:FC:FA:01

    steps:
      - name: Checkout public build shell
        uses: actions/checkout@v4

      - name: Validate private-source token
        env:
          AEGIS_SOURCE_TOKEN: ${{ secrets.AEGIS_SOURCE_TOKEN }}
        run: test -n "${AEGIS_SOURCE_TOKEN:-}"

      - name: Checkout private Vara source
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidVPN-Android
          ref: vara-451-compatibility-privacy-hotspot
          token: ${{ secrets.AEGIS_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout stable signing baseline
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidVPN-Android
          ref: vara-vpn-4.3.1-rebrand-fix
          token: ${{ secrets.AEGIS_SOURCE_TOKEN }}
          path: signing-source
          fetch-depth: 1
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl git swig ninja-build cmake jq
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;$NDK_VERSION" "cmake;3.22.1" "platform-tools" "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION"
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_SDK"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Extract audited private source
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          rm -rf work && mkdir work
          unzip -q SaeidVPN-Android-3.2.0-final-source.zip -d work
          PROJECT_DIR="$(find work -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/private-source/$PROJECT_DIR" >> "$GITHUB_ENV"
          rm -rf "$PROJECT_DIR/ci" "$PROJECT_DIR/.github/support"
          mkdir -p "$PROJECT_DIR/.github"
          cp -a ci "$PROJECT_DIR/ci"
          if [ -d .github/support ]; then cp -a .github/support "$PROJECT_DIR/.github/support"; fi

      - name: Apply Vara 4.5.7 patch chain
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          AEGIS_SOURCE_ROOT="$PWD" bash ci/apply-aegis-430.sh
          python3 ci/rc37-vara-457-evidence-compatibility.py
          grep -q 'versionName = "4.5.7"' app/build.gradle.kts
          grep -q 'versionCode = 457' app/build.gradle.kts
          grep -q 'VaraTunnelVerifier.verify()' app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          grep -q 'constructor(internetOk: Boolean, baselineIp: String?, exitIp: String?)' app/src/main/java/com/v2ray/ang/ui/main/VaraTunnelVerifier.kt
          test -s app/src/main/java/com/v2ray/ang/ui/main/VaraNetworkRadar.kt
          test -s app/src/main/java/com/v2ray/ang/ui/main/VaraLocale.kt

      - name: Install verified Xray core
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-all-errors --output app/libs/libv2ray.aar "$AAR_URL"
          echo "$AAR_SHA256  app/libs/libv2ray.aar" | sha256sum --check --strict

      - name: Build HEV tun2socks JNI
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash ci/build-hev-tunnel.sh

      - name: Build OpenVPN3 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          export AEGIS_OPENVPN3_ABIS='arm64-v8a;x86_64'
          export AEGIS_OPENVPN3_BUILD_ROOT="$PWD/.aegis-openvpn3-build"
          export AEGIS_OPENVPN3_OUT_DIR="$PWD/.aegis-openvpn3-out"
          bash ci/build-openvpn3-core-android.sh
          AEGIS_PROJECT_DIR="$PWD" bash ci/install-openvpn3-runtime.sh
          test -s app/libs/arm64-v8a/libaegis-openvpn3.so
          test -s app/libs/x86_64/libaegis-openvpn3.so

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testPlaystoreDebugUnitTest

      - name: Android lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace lintPlaystoreDebug

      - name: Build release APKs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assemblePlaystoreRelease
          find app/build/outputs/apk/playstore/release -type f -name '*.apk' -print

      - name: Stable-sign Vara 4.5.7 APKs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          SIGN_ENV="$GITHUB_WORKSPACE/signing-source/ci/signing/fieldtest-signing.env"
          SIGN_P12_B64="$GITHUB_WORKSPACE/signing-source/ci/signing/vara-fieldtest-release.p12.b64"
          test -s "$SIGN_ENV"
          test -s "$SIGN_P12_B64"
          set -a
          source "$SIGN_ENV"
          set +a
          test "$VARA_SIGN_CERT_SHA256" = "$EXPECTED_SIGN_CERT_SHA256"

          KEYSTORE="$RUNNER_TEMP/vara-fieldtest-release.p12"
          base64 -d "$SIGN_P12_B64" > "$KEYSTORE"
          test -s "$KEYSTORE"

          rm -rf "$RUNNER_TEMP/vara-signed"
          mkdir -p "$RUNNER_TEMP/vara-signed"
          while IFS= read -r apk; do
            base="$(basename "$apk" .apk)"
            base="${base%-unsigned}"
            aligned="$RUNNER_TEMP/vara-signed/${base}-aligned.apk"
            signed="$RUNNER_TEMP/vara-signed/${base}-signed.apk"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -f -p 4 "$apk" "$aligned"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-type PKCS12 \
              --ks-key-alias "$VARA_SIGN_ALIAS" \
              --ks-pass "pass:$VARA_SIGN_STORE_PASS" \
              --key-pass "pass:$VARA_SIGN_KEY_PASS" \
              --out "$signed" \
              "$aligned"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs "$signed" | tee "$signed.cert.txt"
            grep -Fq "Signer #1 certificate SHA-256 digest: ${EXPECTED_SIGN_CERT_SHA256//:/}" "$signed.cert.txt"
            rm -f "$aligned"
          done < <(find app/build/outputs/apk/playstore/release -type f -name '*.apk' | sort)

          SIGNED_ARM64_APK="$(find "$RUNNER_TEMP/vara-signed" -type f -name '*arm64-v8a*-signed.apk' -print -quit)"
          SIGNED_X86_64_APK="$(find "$RUNNER_TEMP/vara-signed" -type f -name '*x86_64*-signed.apk' -print -quit)"
          SIGNED_UNIVERSAL_APK="$(find "$RUNNER_TEMP/vara-signed" -type f -name '*universal*-signed.apk' -print -quit)"
          test -n "$SIGNED_ARM64_APK"
          test -n "$SIGNED_X86_64_APK"
          test -n "$SIGNED_UNIVERSAL_APK"

          for apk in "$SIGNED_ARM64_APK" "$SIGNED_X86_64_APK" "$SIGNED_UNIVERSAL_APK"; do
            test "$(apkanalyzer manifest application-id "$apk")" = "com.saeiddvc.vpn"
            test "$(apkanalyzer manifest version-name "$apk")" = "4.5.7"
            test "$(apkanalyzer manifest version-code "$apk")" = "457"
            test "$(apkanalyzer manifest debuggable "$apk")" = "false"
          done

          unzip -l "$SIGNED_ARM64_APK" > /tmp/vara-457-arm64-files.txt
          grep -Fq 'lib/arm64-v8a/libaegis-openvpn3.so' /tmp/vara-457-arm64-files.txt
          grep -Fq 'lib/arm64-v8a/libhev-socks5-tunnel.so' /tmp/vara-457-arm64-files.txt
          unzip -l "$SIGNED_X86_64_APK" > /tmp/vara-457-x86-files.txt
          grep -Fq 'lib/x86_64/libaegis-openvpn3.so' /tmp/vara-457-x86-files.txt
          grep -Fq 'lib/x86_64/libhev-socks5-tunnel.so' /tmp/vara-457-x86-files.txt

          echo "SIGNED_ARM64_APK=$SIGNED_ARM64_APK" >> "$GITHUB_ENV"
          echo "SIGNED_X86_64_APK=$SIGNED_X86_64_APK" >> "$GITHUB_ENV"
          echo "SIGNED_UNIVERSAL_APK=$SIGNED_UNIVERSAL_APK" >> "$GITHUB_ENV"

      - name: Android 16 runtime and update-install smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            bash <<'BASH'
            set -euo pipefail
            test -n "$SIGNED_X86_64_APK"
            adb uninstall com.saeiddvc.vpn >/dev/null 2>&1 || true
            adb install "$SIGNED_X86_64_APK"
            adb shell pm path com.saeiddvc.vpn | grep -q '^package:'
            dumpsys package com.saeiddvc.vpn >/tmp/vara-457-package.txt
            grep -q 'versionCode=457' /tmp/vara-457-package.txt
            adb shell monkey -p com.saeiddvc.vpn -c android.intent.category.LAUNCHER 1 >/tmp/vara-457-launch.txt 2>&1
            sleep 5
            APP_PID="$(adb shell pidof -s com.saeiddvc.vpn 2>/dev/null | tr -d '\r' || true)"
            test -n "$APP_PID"
            adb logcat -d -v threadtime --pid="$APP_PID" >/tmp/vara-457-app-logcat.txt || true
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL|NoClassDefFoundError|ClassNotFoundException|ForegroundServiceDidNotStartInTimeException|android\.app\.RemoteServiceException' /tmp/vara-457-app-logcat.txt
            adb install -r "$SIGNED_X86_64_APK"
            dumpsys package com.saeiddvc.vpn >/tmp/vara-457-package-after-update.txt
            grep -q 'versionCode=457' /tmp/vara-457-package-after-update.txt
            BASH

      - name: Prepare signed update-compatible deliverable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp "$SIGNED_ARM64_APK" release-files/Vara-Smart-VPN-4.5.7-ARM64.apk
          cp "$SIGNED_UNIVERSAL_APK" release-files/Vara-Smart-VPN-4.5.7-Universal.apk
          {
            echo 'applicationId=com.saeiddvc.vpn'
            echo 'versionName=4.5.7'
            echo 'versionCode=457'
            echo "signingCertSha256=$EXPECTED_SIGN_CERT_SHA256"
            echo 'signingBaseline=stable Vara field-test certificate used by the 4.3.x update channel'
            echo 'updatePolicy=same-package + same-signing-certificate + monotonically-increasing-versionCode'
            echo 'runtimeGate=Android 16 cold launch + reinstall/update path + OpenVPN3/HEV native library presence'
          } > release-files/UPDATE-CHANNEL.txt
          sha256sum release-files/*.apk | tee release-files/SHA256SUMS.txt

      - name: Upload signed update-compatible APKs
        uses: actions/upload-artifact@v4
        with:
          name: Vara-Smart-VPN-4.5.7-SIGNED-UpdateCompatible
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Vara-Smart-VPN-4.5.7-failure-diagnostics
          path: |
            /tmp/vara-457-arm64-files.txt
            /tmp/vara-457-x86-files.txt
            /tmp/vara-457-package.txt
            /tmp/vara-457-package-after-update.txt
            /tmp/vara-457-launch.txt
            /tmp/vara-457-app-logcat.txt
            ${{ env.PROJECT_DIR }}/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
