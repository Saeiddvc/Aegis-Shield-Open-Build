name: VARA Security 0.2.0 Alpha Build

on:
  push:
    branches: [ vara-security-0.2.0-build ]
    paths:
      - '.github/workflows/vara-security-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vara-build"
          mkdir -p "$ROOT"
          echo '' | base64 -d > "$ROOT/android.tgz"
          tar -xzf "$ROOT/android.tgz" -C "$ROOT"
          echo "ANDROID_PROJECT=$ROOT/android" >> "$GITHUB_ENV"
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android APK
        shell: bash
        run: |
          cd "$ANDROID_PROJECT"
          gradle --no-daemon clean assembleDebug
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$RUNNER_TEMP/android-release"
          cp "$APK" "$RUNNER_TEMP/android-release/VARA-Security-Android-0.2.0-Alpha.apk"
          sha256sum "$RUNNER_TEMP/android-release/VARA-Security-Android-0.2.0-Alpha.apk" > "$RUNNER_TEMP/android-release/VARA-Security-Android-0.2.0-Alpha.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-Android-0.2.0-Alpha
          path: ${{ runner.temp }}/android-release/*
          if-no-files-found: error

  windows:
    name: Windows Installer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Create Windows source
        shell: pwsh
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'vara-build'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          $B64 = ''
          $Bytes = [Convert]::FromBase64String($B64)
          $Archive = Join-Path $Root 'windows.tgz'
          [IO.File]::WriteAllBytes($Archive, $Bytes)
          tar -xzf $Archive -C $Root
          "WINDOWS_PROJECT=$(Join-Path $Root 'windows')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate VARA icon
        shell: pwsh
        run: "& (Join-Path $env:WINDOWS_PROJECT 'make-icon.ps1')"
      - name: Publish Windows app
        shell: pwsh
        run: |
          dotnet publish (Join-Path $env:WINDOWS_PROJECT 'VaraSecurity.csproj') -c Release -r win-x64 --self-contained true -o (Join-Path $env:WINDOWS_PROJECT 'publish') /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:PublishTrimmed=false
          if (!(Test-Path (Join-Path $env:WINDOWS_PROJECT 'publish/VaraSecurity.exe'))) { throw 'Windows publish failed' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          Push-Location $env:WINDOWS_PROJECT
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          $Setup = Join-Path $env:WINDOWS_PROJECT 'installer-output/VARA-Security-Windows-0.2.0-Alpha-Setup.exe'
          if (!(Test-Path $Setup)) { throw 'Installer not created' }
          $Out = Join-Path $env:RUNNER_TEMP 'windows-release'
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          Copy-Item $Setup (Join-Path $Out 'VARA-Security-Windows-0.2.0-Alpha-Setup.exe')
          $hash = (Get-FileHash $Setup -Algorithm SHA256).Hash.ToLower()
          "$hash  VARA-Security-Windows-0.2.0-Alpha-Setup.exe" | Set-Content (Join-Path $Out 'VARA-Security-Windows-0.2.0-Alpha-Setup.sha256')
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-Windows-0.2.0-Alpha
          path: ${{ runner.temp }}/windows-release/*
          if-no-files-found: error
