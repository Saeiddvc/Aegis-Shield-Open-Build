name: Trigger Vara Smart VPN RC4

# Trigger revision: status-beacon-1
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/trigger-vara-smart-vpn-rc4.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch RC4 open build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/vara-smart-vpn-431-rc4-open-build.yml/dispatches \
            -d '{"ref":"main"}'
          echo "RC4 workflow dispatched from free public runner."
