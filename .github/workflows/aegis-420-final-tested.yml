name: Aegis Shield 4.2.0 Final Tested

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/aegis-420-final-tested.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AAR_URL: https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar
      AAR_SHA256: a6b51b525b72a114c10e34288392439b1897c9ff7ce2f8afd7ffdce9d91e93b3
    steps:
      - uses: actions/checkout@v4

      - name: Publish run start marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "AEGIS-420-FINAL-START-${GITHUB_RUN_ID}" \
            --body "Aegis 4.2.0 final-tested run started. Run ID: ${GITHUB_RUN_ID}. Commit: ${GITHUB_SHA}."

      - name: Validate private source token
        env:
          AEGIS_SOURCE_TOKEN: ${{ secrets.AEGIS_SOURCE_TOKEN }}
        run: test -n "${AEGIS_SOURCE_TOKEN:-}"

      - uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidVPN-Android
          token: ${{ secrets.AEGIS_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract and apply deterministic 4.2 patch chain
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          rm -rf work && mkdir work
          unzip -q SaeidVPN-Android-3.2.0-final-source.zip -d work
          PROJECT_DIR="$(find work -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/private-source/$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          AEGIS_SOURCE_ROOT="$GITHUB_WORKSPACE/private-source" bash "$GITHUB_WORKSPACE/private-source/ci/apply-aegis-420.sh"
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisArgoChoiceUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisArgoChoiceUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisArgoImportFeedbackUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisArgoImportFeedbackUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisOrchestratorUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisOrchestratorUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisArgoReachabilityUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisArgoReachabilityUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisZeroDelayRouteUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisZeroDelayRouteUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisProtectionUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisProtectionUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisAdvancedDeviceUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisAdvancedDeviceUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisAboutActivityUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/AegisAboutActivityUiTest.kt

      - name: Install verified Xray and HEV
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-all-errors --output app/libs/libv2ray.aar "$AAR_URL"
          echo "$AAR_SHA256  app/libs/libv2ray.aar" | sha256sum --check --strict
          bash "$GITHUB_WORKSPACE/private-source/ci/build-hev-tunnel.sh"

      - name: Verify final 4.2 runtime contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts').read_text()
          registry = Path('app/src/main/java/com/v2ray/ang/ui/main/AegisProtocolRegistry.kt').read_text()
          fmt = Path('app/src/main/java/com/v2ray/ang/fmt/HttpFmt.kt').read_text()
          ang = Path('app/src/main/java/com/v2ray/ang/handler/AngConfigManager.kt').read_text()
          contract = Path('app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt').read_text()
          vm = Path('app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt').read_text()
          core = Path('app/src/main/java/com/v2ray/ang/core/CoreOutboundBuilder.kt').read_text()
          adv = Path('app/src/main/java/com/v2ray/ang/ui/main/AegisAdvancedScreen.kt').read_text()
          assert 'versionName = "4.2.0"' in gradle and 'versionCode = 49' in gradle
          assert 'val nativeProfiles = AegisProtocolRegistry.runnableProtocolIds' in contract
          assert 'AegisProtocolRegistry.protocolId(profile.configType)' in vm
          assert 'EConfigType.HTTP.protocolScheme to HttpFmt::parse' in ang
          assert 'EConfigType.HTTP -> HttpFmt.toUri(config)' in ang
          assert 'HttpFmt.parse(str) != null' in ang
          assert 'EConfigType.HTTP -> toOutboundHttp(profileItem)' in core
          assert 'EConfigType.HYSTERIA,' not in registry.split('val runnableProfileTypes',1)[1].split(')',1)[0]
          assert 'EConfigType.HYSTERIA -> UNSUPPORTED' in registry
          assert '"openvpn"' not in registry and '"tuic"' not in registry
          assert 'HTTP proxy' in adv and 'Xray JSON' in adv
          assert 'path.isNotEmpty() && path != "/"' in fmt
          print('Aegis 4.2 final runtime capability contract OK')
          PY

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testPlaystoreDebugUnitTest

      - name: Android lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintPlaystoreDebug

      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assemblePlaystoreDebug
          python3 scripts/verify_apk.py
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "app/libs/$abi/libhev-socks5-tunnel.so"
          done

      - name: Free disk and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android 16 instrumentation and cold launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim
          script: |
            bash -lc 'set -euo pipefail; cd "$PROJECT_DIR"; chmod +x gradlew; ./gradlew --no-daemon connectedPlaystoreDebugAndroidTest; bash scripts/android16_cold_launch_test.sh'

      - name: Package final APKs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-files"
          ARM64="$(find "$PROJECT_DIR/app/build/outputs/apk/playstore/debug" -name '*arm64-v8a.apk' -print -quit)"
          UNIVERSAL="$(find "$PROJECT_DIR/app/build/outputs/apk/playstore/debug" -name '*universal.apk' -print -quit)"
          test -n "$ARM64" && test -n "$UNIVERSAL"
          cp "$ARM64" "$GITHUB_WORKSPACE/release-files/Aegis-Shield-VPN-4.2.0-ARM64.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/release-files/Aegis-Shield-VPN-4.2.0-Universal.apk"
          cd "$GITHUB_WORKSPACE/release-files"
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload final tested APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Shield-Android-4.2.0-final-tested
          path: |
            release-files/Aegis-Shield-VPN-4.2.0-ARM64.apk
            release-files/Aegis-Shield-VPN-4.2.0-Universal.apk
            release-files/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish success marker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "AEGIS-420-FINAL-SUCCESS-${GITHUB_RUN_ID}" \
            --body "Aegis 4.2.0 final-tested build passed all gates. Run ID: ${GITHUB_RUN_ID}. Artifact: Aegis-Shield-Android-4.2.0-final-tested."
