name: VARA Security 0.12.0 Real Device Scan Build

on:
  push:
    branches: [ vara-security-0.12.0-detection-core ]
    paths:
      - '.github/workflows/vara-security-126-build.yml'
      - 'vara-build-125/**'
      - 'vara-build-126/**'
      - 'vara-build-127/**'
      - 'vara-build-128/**'
      - 'vara-build-129/**'
      - 'vara-build-130/**'
      - 'vara-build-131/**'
      - 'vara-build-132/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct source through patch 132
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vara-132"
          mkdir -p "$WORK"
          cp -a vara-build-042/android "$WORK/android"
          for v in 043 044 045; do python3 vara-build-$v/patch_$v.py "$WORK/android"; done
          python3 vara-build-046/fix_patch_046.py vara-build-046/patch_046.py
          python3 vara-build-046/patch_046.py "$WORK/android"
          for v in $(seq -w 47 132); do python3 vara-build-$v/patch_$v.py "$WORK/android"; done
          test -f "$WORK/android/app/src/main/java/com/varasecurity/core/scan/DeviceScanJavaBridge.kt"
          grep -q 'DeviceScanJavaBridge.run' "$WORK/android/app/src/main/java/com/varasecurity/alpha031/MainActivity.java"
          echo "ANDROID_PROJECT=$WORK/android" >> "$GITHUB_ENV"
      - name: Compile test and assemble
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd "$ANDROID_PROJECT"
          gradle --no-daemon clean test assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Validate real scan wiring invariants
        shell: bash
        run: |
          set -euo pipefail
          SRC="$ANDROID_PROJECT/app/src/main/java"
          grep -q 'AndroidDeviceScanRuntime.create' "$SRC/com/varasecurity/core/scan/DeviceScanJavaBridge.kt"
          grep -q 'result.getMalwareCount()' "$SRC/com/varasecurity/alpha031/MainActivity.java"
          grep -q 'result.getSuspiciousCount()' "$SRC/com/varasecurity/alpha031/MainActivity.java"
          grep -q 'Scan failed. Try again.' "$SRC/com/varasecurity/alpha031/MainActivity.java"
      - name: Validate security invariants
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$ANDROID_PROJECT/app/src/main/AndroidManifest.xml"
          NSC="$ANDROID_PROJECT/app/src/main/res/xml/network_security_config.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$MANIFEST"
          grep -q '<certificates src="system" />' "$NSC"
          if grep -Eq 'src="user"|src="@raw/' "$NSC"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-0.12.0-Real-Device-Scan-Unsigned
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
