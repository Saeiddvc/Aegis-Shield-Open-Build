name: VARA Security 0.12.0 Android Detection Build

on:
  push:
    branches: [ vara-security-0.12.0-detection-core ]
    paths:
      - '.github/workflows/vara-security-126-build.yml'
      - 'vara-build-125/**'
      - 'vara-build-126/**'
      - 'vara-build-127/**'
      - 'vara-build-128/**'
      - 'vara-build-129/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct source through patch 129
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vara-129"
          mkdir -p "$WORK"
          cp -a vara-build-042/android "$WORK/android"
          for v in 043 044 045; do python3 vara-build-$v/patch_$v.py "$WORK/android"; done
          python3 vara-build-046/fix_patch_046.py vara-build-046/patch_046.py
          python3 vara-build-046/patch_046.py "$WORK/android"
          for v in $(seq -w 47 129); do python3 vara-build-$v/patch_$v.py "$WORK/android"; done
          test -f "$WORK/android/app/src/main/java/com/varasecurity/core/inventory/AndroidPackageInventory.kt"
          test -f "$WORK/android/app/src/main/java/com/varasecurity/core/hash/DefaultInstalledPackageHashScanner.kt"
          test -f "$WORK/android/app/src/main/java/com/varasecurity/core/staticanalysis/DefaultStaticPackageAnalyzer.kt"
          test -f "$WORK/android/app/src/main/java/com/varasecurity/core/cert/DefaultPackageCertificateScanner.kt"
          test -f "$WORK/android/app/src/main/java/com/varasecurity/core/installer/DefaultInstallerReputationAnalyzer.kt"
          echo "ANDROID_PROJECT=$WORK/android" >> "$GITHUB_ENV"
      - name: Compile test and assemble
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd "$ANDROID_PROJECT"
          gradle --no-daemon clean test assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Validate Android detection implementation invariants
        shell: bash
        run: |
          set -euo pipefail
          SRC="$ANDROID_PROJECT/app/src/main/java/com/varasecurity/core"
          grep -q 'MessageDigest.getInstance("SHA-256")' "$SRC/hash/DefaultInstalledPackageHashScanner.kt"
          grep -q 'BIND_ACCESSIBILITY_SERVICE' "$SRC/staticanalysis/DefaultStaticPackageAnalyzer.kt"
          grep -q 'BIND_NOTIFICATION_LISTENER_SERVICE' "$SRC/staticanalysis/DefaultStaticPackageAnalyzer.kt"
          grep -q 'BIND_DEVICE_ADMIN' "$SRC/staticanalysis/DefaultStaticPackageAnalyzer.kt"
          grep -q 'getInstallSourceInfo' "$SRC/installer/DefaultInstallerReputationAnalyzer.kt"
          grep -q 'GET_SIGNING_CERTIFICATES' "$SRC/inventory/AndroidPackageInventory.kt"
          grep -q 'CertificateAssessmentStatus.PARSE_ERROR' "$SRC/cert/DefaultPackageCertificateScanner.kt"
      - name: Validate security invariants
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$ANDROID_PROJECT/app/src/main/AndroidManifest.xml"
          NSC="$ANDROID_PROJECT/app/src/main/res/xml/network_security_config.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$MANIFEST"
          grep -q '<certificates src="system" />' "$NSC"
          if grep -Eq 'src="user"|src="@raw/' "$NSC"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-0.12.0-Android-Detection-Unsigned
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
