name: VARA Security 0.12.1 Product Pass Signed Release Build

on:
  push:
    branches: [ vara-security-0.12.0-detection-core ]
    paths:
      - '.github/workflows/vara-security-126-build.yml'
      - 'vara-build-125/**'
      - 'vara-build-126/**'
      - 'vara-build-127/**'
      - 'vara-build-128/**'
      - 'vara-build-129/**'
      - 'vara-build-130/**'
      - 'vara-build-131/**'
      - 'vara-build-132/**'
      - 'vara-build-133/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct source through patch 133
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vara-133-release"
          mkdir -p "$WORK"
          cp -a vara-build-042/android "$WORK/android"
          for v in 043 044 045; do python3 vara-build-$v/patch_$v.py "$WORK/android"; done
          python3 vara-build-046/fix_patch_046.py vara-build-046/patch_046.py
          python3 vara-build-046/patch_046.py "$WORK/android"
          for v in $(seq -w 47 133); do python3 vara-build-$v/patch_$v.py "$WORK/android"; done
          grep -q "versionCode 1201" "$WORK/android/app/build.gradle"
          grep -q "versionName '0.12.1-alpha'" "$WORK/android/app/build.gradle"
          grep -q 'renderScanResults(DeviceScanResult result)' "$WORK/android/app/src/main/java/com/varasecurity/alpha031/MainActivity.java"
          grep -q 'Uninstall app' "$WORK/android/app/src/main/java/com/varasecurity/alpha031/MainActivity.java"
          echo "ANDROID_PROJECT=$WORK/android" >> "$GITHUB_ENV"

      - name: Build and test release APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd "$ANDROID_PROJECT"
          gradle --no-daemon clean test assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and validate APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vara-1201-sign"
          mkdir -p "$ROOT"
          KEYSTORE="$ROOT/vara-alpha-dev.keystore"
          base64 --decode vara-build-031/vara-alpha-dev.keystore.b64 > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -alias vara_alpha -storepass 'VARAAlphaDev2026!' >/dev/null
          UNSIGNED="$ANDROID_PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$ROOT/vara-aligned.apk"
          OUT="$RUNNER_TEMP/android-release"
          mkdir -p "$OUT"
          FINAL="$OUT/VARA-Security-Android-0.12.1-Alpha.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias vara_alpha --ks-pass pass:'VARAAlphaDev2026!' --key-pass pass:'VARAAlphaDev2026!' --out "$FINAL" "$ALIGNED"
          unzip -t "$FINAL" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee "$OUT/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | tee "$OUT/badging.txt"
          grep -q "package: name='com.varasecurity.alpha031'" "$OUT/badging.txt"
          grep -q "versionCode='1201'" "$OUT/badging.txt"
          grep -q "versionName='0.12.1-alpha'" "$OUT/badging.txt"
          grep -q "sdkVersion:'26'" "$OUT/badging.txt"
          grep -q "targetSdkVersion:'35'" "$OUT/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$FINAL" | tee "$OUT/permissions.txt"
          grep -q 'android.permission.INTERNET' "$OUT/permissions.txt"
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$OUT/permissions.txt"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$OUT/permissions.txt"
          if grep -Eq 'READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CONTACTS|WRITE_CONTACTS|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|SYSTEM_ALERT_WINDOW|REQUEST_INSTALL_PACKAGES|BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_AUTOFILL_SERVICE' "$OUT/permissions.txt"; then echo 'Unexpected sensitive permission detected' >&2; exit 1; fi
          grep -q 'android:allowBackup="false"' "$ANDROID_PROJECT/app/src/main/AndroidManifest.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$ANDROID_PROJECT/app/src/main/AndroidManifest.xml"
          sha256sum "$FINAL" | tee "$OUT/VARA-Security-Android-0.12.1-Alpha.sha256"

      - name: Validate product-pass invariants
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$ANDROID_PROJECT/app/src/main/java/com/varasecurity/alpha031/MainActivity.java"
          grep -q 'result.getConfigRiskCount()' "$MAIN"
          grep -q 'getAssessment().getReasons()' "$MAIN"
          grep -q 'ACTION_APPLICATION_DETAILS_SETTINGS' "$MAIN"
          grep -q 'Intent.ACTION_DELETE' "$MAIN"
          grep -q 'No actionable malware findings' "$MAIN"
          grep -q 'Scan again' "$MAIN"
          grep -q 'Security tools are ready' "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-Android-0.12.1-Alpha-Signed
          path: ${{ runner.temp }}/android-release/*
          if-no-files-found: error
