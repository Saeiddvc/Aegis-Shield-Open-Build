name: VARA Security 0.12.0 Scan Results Mapping Build

on:
  push:
    branches: [ vara-security-0.12.0-detection-core ]
    paths:
      - '.github/workflows/vara-security-126-build.yml'
      - 'vara-build-125/**'
      - 'vara-build-126/**'
      - 'vara-build-127/**'
      - 'vara-build-128/**'
      - 'vara-build-129/**'
      - 'vara-build-130/**'
      - 'vara-build-131/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct source through patch 131
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vara-131"
          mkdir -p "$WORK"
          cp -a vara-build-042/android "$WORK/android"
          for v in 043 044 045; do python3 vara-build-$v/patch_$v.py "$WORK/android"; done
          python3 vara-build-046/fix_patch_046.py vara-build-046/patch_046.py
          python3 vara-build-046/patch_046.py "$WORK/android"
          for v in $(seq -w 47 131); do python3 vara-build-$v/patch_$v.py "$WORK/android"; done
          test -f "$WORK/android/app/src/main/java/com/varasecurity/core/scan/DeviceScanCoordinator.kt"
          test -f "$WORK/android/app/src/main/java/com/varasecurity/ui/scan/UIScanItemMapper.kt"
          test -f "$WORK/android/app/src/main/java/com/varasecurity/ui/scan/ScanResultsMapper.kt"
          echo "ANDROID_PROJECT=$WORK/android" >> "$GITHUB_ENV"
      - name: Compile test and assemble
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd "$ANDROID_PROJECT"
          gradle --no-daemon clean test assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Validate mapping invariants
        shell: bash
        run: |
          set -euo pipefail
          SRC="$ANDROID_PROJECT/app/src/main/java/com/varasecurity/ui/scan"
          grep -q 'partialFailures=result.failures.size' "$SRC/ScanResultsMapper.kt"
          grep -q 'result.assessments.map' "$SRC/ScanResultsMapper.kt"
          grep -q 'DetectionType.MALWARE' "$SRC/UIScanItemMapper.kt"
          grep -q 'REPORT_FALSE_POSITIVE' "$SRC/UIScanItemMapper.kt"
          if grep -q 'knownMaliciousHashCount' "$SRC/ScanResultsMapper.kt"; then exit 1; fi
      - name: Validate security invariants
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$ANDROID_PROJECT/app/src/main/AndroidManifest.xml"
          NSC="$ANDROID_PROJECT/app/src/main/res/xml/network_security_config.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$MANIFEST"
          grep -q '<certificates src="system" />' "$NSC"
          if grep -Eq 'src="user"|src="@raw/' "$NSC"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-0.12.0-Scan-Results-Mapping-Unsigned
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
