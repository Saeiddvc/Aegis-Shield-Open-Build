name: VARA Security 0.5.9 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/vara-security-059-build.yml'
      - 'vara-build-059/**'
      - 'vara-build-058/**'
      - 'vara-build-057/**'
      - 'vara-build-056/**'
      - 'vara-build-055/**'
      - 'vara-build-054/**'
      - 'vara-build-053/**'
      - 'vara-build-052/**'
      - 'vara-build-051/**'
      - 'vara-build-050/**'
      - 'vara-build-049/**'
      - 'vara-build-048/**'
      - 'vara-build-047/**'
      - 'vara-build-046/**'
      - 'vara-build-045/**'
      - 'vara-build-044/**'
      - 'vara-build-043/**'
      - 'vara-build-042/android/**'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare VARA 0.5.9 source
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vara-059"
          mkdir -p "$WORK"
          cp -a vara-build-042/android "$WORK/android"
          python3 vara-build-043/patch_043.py "$WORK/android"
          python3 vara-build-044/patch_044.py "$WORK/android"
          python3 vara-build-045/patch_045.py "$WORK/android"
          python3 vara-build-046/fix_patch_046.py vara-build-046/patch_046.py
          python3 vara-build-046/patch_046.py "$WORK/android"
          python3 vara-build-047/patch_047.py "$WORK/android"
          python3 vara-build-048/patch_048.py "$WORK/android"
          python3 vara-build-049/patch_049.py "$WORK/android"
          python3 vara-build-050/patch_050.py "$WORK/android"
          python3 vara-build-051/patch_051.py "$WORK/android"
          python3 vara-build-052/patch_052.py "$WORK/android"
          python3 vara-build-053/patch_053.py "$WORK/android"
          python3 vara-build-054/patch_054.py "$WORK/android"
          python3 vara-build-055/patch_055.py "$WORK/android"
          python3 vara-build-056/patch_056.py "$WORK/android"
          python3 vara-build-057/patch_057.py "$WORK/android"
          python3 vara-build-058/patch_058.py "$WORK/android"
          python3 vara-build-059/patch_059.py "$WORK/android"
          MAIN="$WORK/android/app/src/main/java/com/varasecurity/alpha031/MainActivity.java"
          grep -q "versionCode 509" "$WORK/android/app/build.gradle"
          grep -q "versionName '0.5.9-alpha'" "$WORK/android/app/build.gradle"
          grep -q '0.5.9 ALPHA' "$MAIN"
          grep -q 'currentPage = "language"' "$MAIN"
          grep -q 'English is the default' "$MAIN"
          grep -q 'currentPage = "compatibility"' "$MAIN"
          grep -q 'private void navigateBack()' "$MAIN"
          grep -q 'WebView.getCurrentWebViewPackage()' "$MAIN"
          grep -q 'webViewRuntimeReady()' "$MAIN"
          grep -q 'isDeviceLockSecure()' "$MAIN"
          grep -q 'developerOptionsEnabled()' "$MAIN"
          grep -q 'adbEnabled()' "$MAIN"
          grep -q 'deviceTrustIssueCount()' "$MAIN"
          grep -q 'packageRequestsPermission(PackageInfo pi, String permission)' "$MAIN"
          grep -q 'packageDeclaresAccessibilityService(PackageInfo pi)' "$MAIN"
          grep -q 'REQUEST_INSTALL_PACKAGES' "$MAIN"
          grep -q 'SYSTEM_ALERT_WINDOW' "$MAIN"
          grep -q 'BIND_ACCESSIBILITY_SERVICE' "$MAIN"
          grep -q 'Declares an Accessibility service' "$MAIN"
          grep -q 'Capability signals mean the app declares access in its manifest' "$MAIN"
          grep -q 'Safe Browsing unavailable — session closed' "$MAIN"
          grep -q 'request.isForMainFrame()' "$MAIN"
          grep -q 'setAcceptThirdPartyCookies(web, false)' "$MAIN"
          grep -q 'FLAG_SECURE' "$MAIN"
          grep -q 'WebView.setWebContentsDebuggingEnabled(false)' "$MAIN"
          grep -q 'setJavaScriptCanOpenWindowsAutomatically(false)' "$MAIN"
          grep -q 'setAllowUniversalAccessFromFileURLs(false)' "$MAIN"
          grep -q 'setGeolocationEnabled(false)' "$MAIN"
          grep -q 'setCacheMode(WebSettings.LOAD_NO_CACHE)' "$MAIN"
          grep -q 'clearSslPreferences()' "$MAIN"
          grep -q 'onSafeBrowsingHit' "$MAIN"
          grep -q 'response.backToSafety(true)' "$MAIN"
          grep -q 'onPermissionRequest' "$MAIN"
          grep -q 'request.deny()' "$MAIN"
          grep -q 'onPageCommitVisible' "$MAIN"
          grep -q 'setDownloadListener' "$MAIN"
          grep -q 'setSafeBrowsingEnabled(true)' "$MAIN"
          grep -q 'VERSION.SECURITY_PATCH' "$MAIN"
          grep -q 'onRenderProcessGone' "$MAIN"
          grep -q 'Secure Browser blocked a TLS certificate error' "$MAIN"
          echo "ANDROID_PROJECT=$WORK/android" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd "$ANDROID_PROJECT"
          gradle --no-daemon clean assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign, validate and compatibility-check
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vara-059-sign"
          mkdir -p "$ROOT"
          KEYSTORE="$ROOT/vara-alpha-dev.keystore"
          base64 --decode vara-build-031/vara-alpha-dev.keystore.b64 > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -alias vara_alpha -storepass 'VARAAlphaDev2026!' >/dev/null
          UNSIGNED="$ANDROID_PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$ROOT/vara-aligned.apk"
          OUT="$RUNNER_TEMP/android-release"
          mkdir -p "$OUT"
          FINAL="$OUT/VARA-Security-Android-0.5.9-Alpha.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias vara_alpha \
            --ks-pass pass:'VARAAlphaDev2026!' --key-pass pass:'VARAAlphaDev2026!' \
            --out "$FINAL" "$ALIGNED"

          unzip -t "$FINAL" >/dev/null
          unzip -p "$FINAL" classes.dex | strings > "$ROOT/dex-strings.txt"
          if grep -q 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE' "$ROOT/dex-strings.txt"; then
            echo 'Forbidden AV test payload found in release binary' >&2
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee "$OUT/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | tee "$OUT/badging.txt"
          grep -q "versionCode='509'" "$OUT/badging.txt"
          grep -q "versionName='0.5.9-alpha'" "$OUT/badging.txt"
          grep -q "sdkVersion:'26'" "$OUT/badging.txt"
          grep -q "targetSdkVersion:'35'" "$OUT/badging.txt"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$FINAL" | tee "$OUT/permissions.txt"
          grep -q 'android.permission.INTERNET' "$OUT/permissions.txt"
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$OUT/permissions.txt"
          if grep -Eq 'READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CONTACTS|WRITE_CONTACTS|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|SYSTEM_ALERT_WINDOW|REQUEST_INSTALL_PACKAGES|BIND_ACCESSIBILITY_SERVICE' "$OUT/permissions.txt"; then
            echo 'Unexpected sensitive permission detected' >&2
            exit 1
          fi

          grep -q 'android:allowBackup="false"' "$ANDROID_PROJECT/app/src/main/AndroidManifest.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$ANDROID_PROJECT/app/src/main/AndroidManifest.xml"
          sha256sum "$FINAL" | tee "$OUT/VARA-Security-Android-0.5.9-Alpha.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-Android-0.5.9-Alpha
          path: ${{ runner.temp }}/android-release/*
          if-no-files-found: error

      - name: Publish validated APK to persistent release branch
        shell: bash
        run: |
          set -euo pipefail
          FINAL="$RUNNER_TEMP/android-release/VARA-Security-Android-0.5.9-Alpha.apk"
          HASH="$RUNNER_TEMP/android-release/VARA-Security-Android-0.5.9-Alpha.sha256"
          PUB="$RUNNER_TEMP/vara-release"
          git fetch origin vara-security-releases
          git worktree add "$PUB" origin/vara-security-releases
          cd "$PUB"
          git checkout -B vara-security-releases origin/vara-security-releases
          mkdir -p releases
          cp "$FINAL" releases/VARA-Security-Android-0.5.9-Alpha.apk
          cp "$HASH" releases/VARA-Security-Android-0.5.9-Alpha.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/VARA-Security-Android-0.5.9-Alpha.apk releases/VARA-Security-Android-0.5.9-Alpha.sha256
          git commit -m "Publish VARA Security 0.5.9 Alpha APK"
          git push origin HEAD:vara-security-releases
