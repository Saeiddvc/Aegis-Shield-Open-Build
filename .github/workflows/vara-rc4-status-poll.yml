name: Vara Smart VPN RC4 Status Poll

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/vara-rc4-status-poll.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Query latest RC4 workflow run and publish status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p status
          curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vara-smart-vpn-431-rc4-open-build.yml/runs?per_page=1" \
            > /tmp/runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/runs.json').read_text())
          runs = data.get('workflow_runs') or []
          if not runs:
              raise SystemExit('No RC4 workflow runs found')
          r = runs[0]
          out = {
              'workflow': r.get('name'),
              'run_id': r.get('id'),
              'run_number': r.get('run_number'),
              'status': r.get('status'),
              'conclusion': r.get('conclusion'),
              'event': r.get('event'),
              'head_sha': r.get('head_sha'),
              'created_at': r.get('created_at'),
              'updated_at': r.get('updated_at'),
              'run_url': r.get('html_url'),
          }
          Path('status/vara-smart-vpn-rc4.json').write_text(json.dumps(out, indent=2, sort_keys=True)+'\n')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/vara-smart-vpn-rc4.json
          if ! git diff --cached --quiet; then
            git commit -m "Poll Vara Smart VPN RC4 build status"
            git push origin HEAD:main
          fi
