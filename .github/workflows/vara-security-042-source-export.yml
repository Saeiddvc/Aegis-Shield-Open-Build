name: VARA Security 0.4.2 Source Export

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/vara-security-042-source-export.yml'
      - 'vara-build-040/**'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vara-042-src"
          mkdir -p "$ROOT"
          cat vara-build-040/android-src.part00 \
              vara-build-040/android-src.part01 \
              vara-build-040/android-src.part02 \
              vara-build-040/android-src.part03 \
              vara-build-040/android-src.part04 \
              vara-build-040/android-src.part05 \
              vara-build-040/android-src.part06 \
              vara-build-040/android-src.part07 | tr -d '\r\n ' > "$ROOT/android-src.b64"
          base64 --decode "$ROOT/android-src.b64" > "$ROOT/android.tgz"
          tar -xzf "$ROOT/android.tgz" -C "$ROOT"
          find "$ROOT/android" -maxdepth 6 -type f | sort > "$ROOT/file-list.txt"
          tar -czf "$ROOT/VARA-Android-Source-0.4.2-inspection.tgz" -C "$ROOT" android
      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Android-Source-0.4.2-inspection
          path: |
            ${{ runner.temp }}/vara-042-src/VARA-Android-Source-0.4.2-inspection.tgz
            ${{ runner.temp }}/vara-042-src/file-list.txt
          if-no-files-found: error
