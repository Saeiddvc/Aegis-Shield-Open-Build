name: Aegis 4.3 OpenVPN3 Native Probe

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/aegis-430-openvpn3-native-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  native-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Publish run start marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "AEGIS-430-OVPN3-PROBE-${GITHUB_RUN_ID}" \
            --body "OpenVPN3 Android native probe started. Run ID: ${GITHUB_RUN_ID}. Commit: ${GITHUB_SHA}."
      - name: Validate private source token
        env:
          AEGIS_SOURCE_TOKEN: ${{ secrets.AEGIS_SOURCE_TOKEN }}
        run: test -n "${AEGIS_SOURCE_TOKEN:-}"
      - uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidVPN-Android
          token: ${{ secrets.AEGIS_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install host build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends swig ninja-build
      - name: Ensure Android NDK 29
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build official OpenVPN3 core for ARM64
        shell: bash
        env:
          AEGIS_OPENVPN3_ABIS: arm64-v8a
          AEGIS_OPENVPN3_OUT_DIR: ${{ github.workspace }}/openvpn3-out
          AEGIS_OPENVPN3_BUILD_ROOT: ${{ github.workspace }}/openvpn3-build
        run: |
          set -euo pipefail
          chmod +x private-source/ci/build-openvpn3-core-android.sh
          private-source/ci/build-openvpn3-core-android.sh
          test -s openvpn3-out/jni/arm64-v8a/libaegis-openvpn3.so
          test -n "$(find openvpn3-out/java -name 'ClientAPI_OpenVPNClient.java' -print -quit)"
          file openvpn3-out/jni/arm64-v8a/libaegis-openvpn3.so
          ls -lh openvpn3-out/jni/arm64-v8a/libaegis-openvpn3.so
      - name: Upload native probe
        uses: actions/upload-artifact@v4
        with:
          name: aegis-430-openvpn3-native-probe
          path: openvpn3-out
          if-no-files-found: error
          retention-days: 3
      - name: Publish success marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "AEGIS-430-OVPN3-PROBE-SUCCESS-${GITHUB_RUN_ID}" \
            --body "OpenVPN3 Android native probe succeeded. Run ID: ${GITHUB_RUN_ID}. Artifact: aegis-430-openvpn3-native-probe."
