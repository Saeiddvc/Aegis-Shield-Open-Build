name: VARA Security 0.3.1 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/vara-security-030-pr-build.yml'
      - 'vara-build-030/**'
      - 'vara-build-031/**'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reassemble and extract Android source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vara-031"
          mkdir -p "$ROOT"
          cat vara-build-031/android-src.part00 \
              vara-build-031/android-src.part01 \
              vara-build-031/android-src.part02 \
              vara-build-031/android-src.part03 \
              vara-build-031/android-src.part04 \
              vara-build-031/android-src.part05 | tr -d '\r\n ' > "$ROOT/android-src.b64"
          base64 --decode "$ROOT/android-src.b64" > "$ROOT/android.tgz"
          gzip -t "$ROOT/android.tgz"
          tar -xzf "$ROOT/android.tgz" -C "$ROOT"
          test -f "$ROOT/android/settings.gradle"
          test -f "$ROOT/android/app/build.gradle"
          echo "ANDROID_PROJECT=$ROOT/android" >> "$GITHUB_ENV"
      - name: Build unsigned Android release APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd "$ANDROID_PROJECT"
          gradle --no-daemon clean assembleRelease
          test -f "$ANDROID_PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk"
      - name: Sign and validate Android APK with stable alpha key
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vara-031"
          KEYSTORE="$ROOT/vara-alpha-dev.keystore"
          base64 --decode vara-build-031/vara-alpha-dev.keystore.b64 > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -alias vara_alpha -storepass 'VARAAlphaDev2026!' >/dev/null
          UNSIGNED="$ANDROID_PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$ROOT/vara-aligned.apk"
          OUT="$RUNNER_TEMP/android-release"
          mkdir -p "$OUT"
          FINAL="$OUT/VARA-Security-Android-0.3.1-Alpha.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias vara_alpha \
            --ks-pass pass:'VARAAlphaDev2026!' \
            --key-pass pass:'VARAAlphaDev2026!' \
            --out "$FINAL" \
            "$ALIGNED"
          unzip -t "$FINAL" >/dev/null
          unzip -l "$FINAL" | grep -q classes.dex
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL"
          sha256sum "$FINAL" > "$OUT/VARA-Security-Android-0.3.1-Alpha.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-Android-0.3.1-Alpha-StableSigned
          path: ${{ runner.temp }}/android-release/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Extract Windows source
        shell: pwsh
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'vara-031'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          $b64 = Get-Content -Raw 'vara-build-030/windows-src.b64'
          [IO.File]::WriteAllBytes((Join-Path $Root 'windows.tgz'), [Convert]::FromBase64String($b64.Trim()))
          tar -xzf (Join-Path $Root 'windows.tgz') -C $Root
          if (!(Test-Path (Join-Path $Root 'windows/VaraSecurity.csproj'))) { throw 'Windows source bundle invalid' }
          "WINDOWS_PROJECT=$(Join-Path $Root 'windows')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows x64 app
        shell: pwsh
        run: |
          & (Join-Path $env:WINDOWS_PROJECT 'make-icon.ps1')
          dotnet publish (Join-Path $env:WINDOWS_PROJECT 'VaraSecurity.csproj') -c Release -r win-x64 --self-contained true -o (Join-Path $env:WINDOWS_PROJECT 'publish') /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:PublishTrimmed=false
          if (!(Test-Path (Join-Path $env:WINDOWS_PROJECT 'publish/VaraSecurity.exe'))) { throw 'Windows publish failed' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Push-Location $env:WINDOWS_PROJECT
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          $Setup = Join-Path $env:WINDOWS_PROJECT 'installer-output/VARA-Security-Windows-0.3.0-Alpha-Setup.exe'
          if (!(Test-Path $Setup)) { throw 'Installer not created' }
          $Out = Join-Path $env:RUNNER_TEMP 'windows-release'
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          $Final = Join-Path $Out 'VARA-Security-Windows-0.3.1-Alpha-Setup.exe'
          Copy-Item $Setup $Final
          $hash = (Get-FileHash $Final -Algorithm SHA256).Hash.ToLower()
          "$hash  VARA-Security-Windows-0.3.1-Alpha-Setup.exe" | Set-Content (Join-Path $Out 'VARA-Security-Windows-0.3.1-Alpha-Setup.sha256')
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-Windows-0.3.1-Alpha
          path: ${{ runner.temp }}/windows-release/*
          if-no-files-found: error
