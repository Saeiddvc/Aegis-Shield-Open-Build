name: Aegis 4.3.0 OpenVPN Integration Probe

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/aegis-430-openvpn-integration-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AAR_URL: https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar
      AAR_SHA256: a6b51b525b72a114c10e34288392439b1897c9ff7ce2f8afd7ffdce9d91e93b3
    steps:
      - uses: actions/checkout@v4
      - name: Publish run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "AEGIS-430-INTEGRATION-${GITHUB_RUN_ID}" \
            --body "Aegis 4.3 OpenVPN integration probe started. Run ID: ${GITHUB_RUN_ID}. Commit: ${GITHUB_SHA}."
      - name: Validate private source token
        env:
          AEGIS_SOURCE_TOKEN: ${{ secrets.AEGIS_SOURCE_TOKEN }}
        run: test -n "${AEGIS_SOURCE_TOKEN:-}"
      - uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidVPN-Android
          token: ${{ secrets.AEGIS_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build tools and NDK 29
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends swig ninja-build
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Extract and apply Aegis 4.3 patch chain
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          rm -rf work && mkdir work
          unzip -q SaeidVPN-Android-3.2.0-final-source.zip -d work
          PROJECT_DIR="$(find work -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/private-source/$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          AEGIS_SOURCE_ROOT="$GITHUB_WORKSPACE/private-source" bash "$GITHUB_WORKSPACE/private-source/ci/apply-aegis-430.sh"
      - name: Build and install official OpenVPN3 Android runtime
        shell: bash
        env:
          AEGIS_OPENVPN3_ABIS: arm64-v8a;armeabi-v7a;x86_64;x86
          AEGIS_OPENVPN3_OUT_DIR: ${{ github.workspace }}/openvpn3-out
          AEGIS_OPENVPN3_BUILD_ROOT: ${{ github.workspace }}/openvpn3-build
        run: |
          set -euo pipefail
          chmod +x private-source/ci/build-openvpn3-core-android.sh
          chmod +x private-source/ci/package-openvpn3-runtime.sh
          chmod +x private-source/ci/install-openvpn3-runtime.sh
          private-source/ci/build-openvpn3-core-android.sh
          private-source/ci/package-openvpn3-runtime.sh
          cd "$PROJECT_DIR"
          AEGIS_PROJECT_DIR="$PROJECT_DIR" \
          AEGIS_OPENVPN3_OUT_DIR="$GITHUB_WORKSPACE/openvpn3-out" \
          AEGIS_OPENVPN3_BUILD_ROOT="$GITHUB_WORKSPACE/openvpn3-build" \
            "$GITHUB_WORKSPACE/private-source/ci/install-openvpn3-runtime.sh"
      - name: Install verified Xray and HEV
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-all-errors --output app/libs/libv2ray.aar "$AAR_URL"
          echo "$AAR_SHA256  app/libs/libv2ray.aar" | sha256sum --check --strict
          bash "$GITHUB_WORKSPACE/private-source/ci/build-hev-tunnel.sh"
      - name: Verify Aegis 4.3 OpenVPN runtime contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts').read_text()
          registry = Path('app/src/main/java/com/v2ray/ang/ui/main/AegisProtocolRegistry.kt').read_text()
          fmt = Path('app/src/main/java/com/v2ray/ang/fmt/OpenVpnFmt.kt').read_text()
          engine = Path('app/src/main/java/com/v2ray/ang/service/OpenVpn3EngineManager.kt').read_text()
          vpn = Path('app/src/main/java/com/v2ray/ang/service/CoreVpnService.kt').read_text()
          ping = Path('app/src/main/java/com/v2ray/ang/service/RealPingWorkerService.kt').read_text()
          vm = Path('app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt').read_text()
          assert 'versionName = "4.3.0"' in gradle and 'versionCode = 50' in gradle
          assert 'EConfigType.OPENVPN' in registry and 'const val OPENVPN = "openvpn"' in registry
          assert 'OpenVpnFmt.looksLikeProfile' in Path('app/src/main/java/com/v2ray/ang/handler/AngConfigManager.kt').read_text()
          assert 'rawConfigHash' in Path('app/src/main/java/com/v2ray/ang/dto/entities/ProfileItem.kt').read_text()
          assert 'class AegisOpenVpnClient' in engine
          assert 'System.loadLibrary("aegis-openvpn3")' in engine
          assert 'override fun socket_protect' in engine and 'service.protect(socket)' in engine
          assert 'override fun tun_builder_establish()' in engine and 'descriptor.detachFd()' in engine
          assert 'OpenVpn3EngineManager.start(this)' in vpn
          assert 'selectedConfigType() == EConfigType.OPENVPN' in vpn
          assert 'configurePerAppProxy(builder, includeSelfInVpn = true)' in vpn
          assert 'OpenVpn3EngineManager.measureInternetDelay' in ping
          assert 'previousProtocol == SmartProtocol.OPENVPN' in vm
          for abi in ('arm64-v8a','armeabi-v7a','x86_64','x86'):
              assert Path(f'app/libs/{abi}/libaegis-openvpn3.so').stat().st_size > 0
              assert Path(f'app/libs/{abi}/libc++_shared.so').stat().st_size > 0
          assert Path('app/src/main/java/com/saeiddvc/aegis/openvpn3/ClientAPI_OpenVPNClient.java').is_file()
          assert Path('app/src/main/java/com/saeiddvc/aegis/openvpn3/ClientAPI_TunBuilderBase.java').is_file()
          print('Aegis 4.3 OpenVPN runtime contract OK')
          PY
      - name: Unit tests and compilation
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testPlaystoreDebugUnitTest
      - name: Android lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintPlaystoreDebug
      - name: APK build and native packaging verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assemblePlaystoreDebug
          python3 scripts/verify_apk.py
          UNIVERSAL="$(find app/build/outputs/apk/playstore/debug -name '*universal.apk' -print -quit)"
          test -n "$UNIVERSAL"
          unzip -l "$UNIVERSAL" > "$GITHUB_WORKSPACE/apk-list.txt"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            grep -q "lib/$abi/libaegis-openvpn3.so" "$GITHUB_WORKSPACE/apk-list.txt"
            grep -q "lib/$abi/libc++_shared.so" "$GITHUB_WORKSPACE/apk-list.txt"
          done
      - name: Upload integration APKs
        uses: actions/upload-artifact@v4
        with:
          name: aegis-430-openvpn-integration-probe
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/playstore/debug/*.apk
            ${{ github.workspace }}/apk-list.txt
            ${{ github.workspace }}/openvpn3-out/BUILD-METADATA.txt
            ${{ github.workspace }}/openvpn3-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
      - name: Publish success marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "AEGIS-430-INTEGRATION-SUCCESS-${GITHUB_RUN_ID}" \
            --body "Aegis 4.3 OpenVPN integration compiled, unit-tested, linted and APK-packaged successfully. Run ID: ${GITHUB_RUN_ID}. Artifact: aegis-430-openvpn-integration-probe."
