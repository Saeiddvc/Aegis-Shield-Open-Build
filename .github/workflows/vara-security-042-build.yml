name: VARA Security 0.4.2 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/vara-security-042-build.yml'
      - 'vara-build-042/**'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd vara-build-042/android
          gradle --no-daemon clean assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign, validate and compatibility-check
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vara-042"
          mkdir -p "$ROOT"
          KEYSTORE="$ROOT/vara-alpha-dev.keystore"
          base64 --decode vara-build-031/vara-alpha-dev.keystore.b64 > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -alias vara_alpha -storepass 'VARAAlphaDev2026!' >/dev/null
          UNSIGNED="vara-build-042/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$ROOT/vara-aligned.apk"
          OUT="$RUNNER_TEMP/android-release"
          mkdir -p "$OUT"
          FINAL="$OUT/VARA-Security-Android-0.4.2-Alpha.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias vara_alpha \
            --ks-pass pass:'VARAAlphaDev2026!' --key-pass pass:'VARAAlphaDev2026!' \
            --out "$FINAL" "$ALIGNED"
          unzip -t "$FINAL" >/dev/null
          unzip -p "$FINAL" classes.dex | strings > "$ROOT/dex-strings.txt"
          if grep -q 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE' "$ROOT/dex-strings.txt"; then
            echo 'Forbidden AV test payload found in release binary' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee "$OUT/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | tee "$OUT/badging.txt"
          grep -q "versionCode='402'" "$OUT/badging.txt"
          grep -q "versionName='0.4.2-alpha'" "$OUT/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$FINAL" | tee "$OUT/permissions.txt"
          grep -q 'android.permission.INTERNET' "$OUT/permissions.txt"
          grep -q 'android.permission.QUERY_ALL_PACKAGES' "$OUT/permissions.txt"
          sha256sum "$FINAL" | tee "$OUT/VARA-Security-Android-0.4.2-Alpha.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Security-Android-0.4.2-Alpha
          path: ${{ runner.temp }}/android-release/*
          if-no-files-found: error
