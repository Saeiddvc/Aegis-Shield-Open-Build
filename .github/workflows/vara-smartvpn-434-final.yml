name: Vara Smart VPN 4.3.4 Final

on:
  push:
    branches: [ vara-smartvpn-4.3.4-final ]
    paths:
      - '.github/workflows/vara-smartvpn-434-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-final:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AAR_URL: https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar
      AAR_SHA256: a6b51b525b72a114c10e34288392439b1897c9ff7ce2f8afd7ffdce9d91e93b3
    steps:
      - uses: actions/checkout@v4

      - name: Validate private source token
        env:
          AEGIS_SOURCE_TOKEN: ${{ secrets.AEGIS_SOURCE_TOKEN }}
        run: test -n "${AEGIS_SOURCE_TOKEN:-}"

      - uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidVPN-Android
          token: ${{ secrets.AEGIS_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android NDK 29
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Extract real core and apply deterministic patch chain
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          rm -rf work && mkdir work
          unzip -q SaeidVPN-Android-3.2.0-final-source.zip -d work
          PROJECT_DIR="$(find work -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/private-source/$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          AEGIS_SOURCE_ROOT="$GITHUB_WORKSPACE/private-source" bash "$GITHUB_WORKSPACE/private-source/ci/apply-aegis-430.sh"

      - name: Apply Vara 4.3.4 branding and architecture guard
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          text = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "4.3.4"', text, count=1)
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 53', text, count=1)
          gradle.write_text(text)

          for p in Path('app/src/main/res').glob('values*/strings.xml'):
              s = p.read_text()
              s = re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)', r'\1Vara Smart VPN\2', s, flags=re.S)
              s = s.replace('Aegis Shield', 'Vara Smart VPN')
              p.write_text(s)

          # Preserve the real core in its JNI/runtime-compatible packages.
          required = [
              Path('app/src/main/java/com/v2ray/ang/service/CoreVpnService.kt'),
              Path('app/src/main/java/com/v2ray/ang/service/OpenVpn3EngineManager.kt'),
              Path('app/src/main/java/com/v2ray/ang/handler/AngConfigManager.kt'),
              Path('app/src/main/java/com/v2ray/ang/fmt/OpenVpnFmt.kt'),
              Path('app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt'),
              Path('app/src/main/java/com/v2ray/ang/ui/main/AegisProtocolRegistry.kt'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          assert not missing, f'Missing preserved core files: {missing}'
          assert not Path('app/src/main/java/com/vara/core').exists(), 'Core must not be moved under com.vara.core'

          # Vara-owned presentation namespace; core remains under com.v2ray.ang.*.
          markers = {
              'app/src/main/java/com/vara/ui/home/HomeUiBoundary.kt': 'package com.vara.ui.home\n\ninternal object HomeUiBoundary\n',
              'app/src/main/java/com/vara/ui/servers/ServersUiBoundary.kt': 'package com.vara.ui.servers\n\ninternal object ServersUiBoundary\n',
              'app/src/main/java/com/vara/ui/protection/ProtectionUiBoundary.kt': 'package com.vara.ui.protection\n\ninternal object ProtectionUiBoundary\n',
              'app/src/main/java/com/vara/ui/settings/SettingsUiBoundary.kt': 'package com.vara.ui.settings\n\ninternal object SettingsUiBoundary\n',
              'app/src/main/java/com/vara/model/VaraPresentationBoundary.kt': 'package com.vara.model\n\ninternal object VaraPresentationBoundary\n',
              'app/src/main/java/com/vara/mapper/VaraMapperBoundary.kt': 'package com.vara.mapper\n\ninternal object VaraMapperBoundary\n',
              'app/src/main/java/com/vara/repository/VaraRepositoryBoundary.kt': 'package com.vara.repository\n\ninternal object VaraRepositoryBoundary\n',
              'app/src/main/java/com/vara/manager/VaraManagerBoundary.kt': 'package com.vara.manager\n\ninternal object VaraManagerBoundary\n',
              'app/src/main/java/com/vara/util/VaraUtilBoundary.kt': 'package com.vara.util\n\ninternal object VaraUtilBoundary\n',
          }
          for name, content in markers.items():
              p = Path(name); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(content)

          print('Vara 4.3.4 branding and architecture guard applied')
          PY

      - name: Reuse verified all-ABI OpenVPN3 runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/openvpn3-download"
          gh run download 32235073201 --repo Saeiddvc/Aegis-Shield-Open-Build --name aegis-430-openvpn3-allabi-probe --dir "$GITHUB_WORKSPACE/openvpn3-download"
          if [ -d "$GITHUB_WORKSPACE/openvpn3-download/jni" ]; then
            mv "$GITHUB_WORKSPACE/openvpn3-download" "$GITHUB_WORKSPACE/openvpn3-out"
          else
            INNER="$(find "$GITHUB_WORKSPACE/openvpn3-download" -mindepth 1 -maxdepth 2 -type d -name jni -print -quit)"
            test -n "$INNER"
            ROOT="$(dirname "$INNER")"
            mv "$ROOT" "$GITHUB_WORKSPACE/openvpn3-out"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "$GITHUB_WORKSPACE/openvpn3-out/jni/$abi/libaegis-openvpn3.so"
          done

      - name: Install OpenVPN3 runtime
        shell: bash
        run: |
          set -euo pipefail
          chmod +x private-source/ci/package-openvpn3-runtime.sh private-source/ci/install-openvpn3-runtime.sh
          AEGIS_OPENVPN3_OUT_DIR="$GITHUB_WORKSPACE/openvpn3-out" private-source/ci/package-openvpn3-runtime.sh
          AEGIS_PROJECT_DIR="$PROJECT_DIR" AEGIS_OPENVPN3_OUT_DIR="$GITHUB_WORKSPACE/openvpn3-out" AEGIS_OPENVPN3_BUILD_ROOT="$GITHUB_WORKSPACE/openvpn3-download" private-source/ci/install-openvpn3-runtime.sh

      - name: Install verified Xray and HEV
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-all-errors --output app/libs/libv2ray.aar "$AAR_URL"
          echo "$AAR_SHA256  app/libs/libv2ray.aar" | sha256sum --check --strict
          bash "$GITHUB_WORKSPACE/private-source/ci/build-hev-tunnel.sh"

      - name: Verify real-core contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts').read_text()
          service = Path('app/src/main/java/com/v2ray/ang/service/CoreVpnService.kt').read_text()
          engine = Path('app/src/main/java/com/v2ray/ang/service/OpenVpn3EngineManager.kt').read_text()
          vm = Path('app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt').read_text()
          registry = Path('app/src/main/java/com/v2ray/ang/ui/main/AegisProtocolRegistry.kt').read_text()
          assert 'versionName = "4.3.4"' in gradle and 'versionCode = 53' in gradle
          assert 'OpenVpn3EngineManager.start(this)' in service
          assert 'System.loadLibrary("aegis-openvpn3")' in engine
          assert 'override fun tun_builder_establish()' in engine
          assert 'selectAutomaticRoute' in vm and 'selectSmartRoute' in vm
          assert 'const val OPENVPN = "openvpn"' in registry
          assert not Path('app/src/main/java/com/vara/core').exists()
          for abi in ('arm64-v8a','armeabi-v7a','x86_64','x86'):
              assert Path(f'app/libs/{abi}/libaegis-openvpn3.so').stat().st_size > 0
              assert Path(f'app/libs/{abi}/libc++_shared.so').stat().st_size > 0
              assert Path(f'app/libs/{abi}/libhev-socks5-tunnel.so').stat().st_size > 0
          print('Vara 4.3.4 real-core contract OK')
          PY

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testPlaystoreDebugUnitTest

      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assemblePlaystoreDebug
          python3 scripts/verify_apk.py
          UNIVERSAL="$(find app/build/outputs/apk/playstore/debug -name '*universal.apk' -print -quit)"
          test -n "$UNIVERSAL"
          unzip -l "$UNIVERSAL" > "$GITHUB_WORKSPACE/apk-list.txt"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            grep -q "lib/$abi/libaegis-openvpn3.so" "$GITHUB_WORKSPACE/apk-list.txt"
            grep -q "lib/$abi/libc++_shared.so" "$GITHUB_WORKSPACE/apk-list.txt"
            grep -q "lib/$abi/libhev-socks5-tunnel.so" "$GITHUB_WORKSPACE/apk-list.txt"
          done

      - name: Package final APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-files"
          ARM64="$(find "$PROJECT_DIR/app/build/outputs/apk/playstore/debug" -name '*arm64-v8a.apk' -print -quit)"
          UNIVERSAL="$(find "$PROJECT_DIR/app/build/outputs/apk/playstore/debug" -name '*universal.apk' -print -quit)"
          test -n "$ARM64" && test -n "$UNIVERSAL"
          cp "$ARM64" "$GITHUB_WORKSPACE/release-files/Vara-Smart-VPN-4.3.4-ARM64.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/release-files/Vara-Smart-VPN-4.3.4-Universal.apk"
          cd "$GITHUB_WORKSPACE/release-files"
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload final APKs
        uses: actions/upload-artifact@v4
        with:
          name: Vara-Smart-VPN-4.3.4-final
          path: |
            release-files/Vara-Smart-VPN-4.3.4-ARM64.apk
            release-files/Vara-Smart-VPN-4.3.4-Universal.apk
            release-files/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
