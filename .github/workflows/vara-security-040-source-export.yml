name: VARA Security 0.4 Source Export

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/vara-security-040-source-export.yml'
      - 'vara-build-032/**'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble 0.3.2 Android source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vara-040"
          mkdir -p "$ROOT"
          cat vara-build-032/android-src.part00 \
              vara-build-032/android-src.part01 \
              vara-build-032/android-src.part02 \
              vara-build-032/android-src.part03 \
              vara-build-032/android-src.part04 | tr -d '\r\n ' > "$ROOT/android-src.b64"
          base64 --decode "$ROOT/android-src.b64" > "$ROOT/android.tgz"
          gzip -t "$ROOT/android.tgz"
          tar -xzf "$ROOT/android.tgz" -C "$ROOT"
          test -f "$ROOT/android/settings.gradle"
          test -f "$ROOT/android/app/build.gradle"
          tar -czf "$RUNNER_TEMP/VARA-Android-0.3.2-Source.tgz" -C "$ROOT" android
      - uses: actions/upload-artifact@v4
        with:
          name: VARA-Android-0.3.2-Source
          path: ${{ runner.temp }}/VARA-Android-0.3.2-Source.tgz
          if-no-files-found: error
