name: Aegis Shield 4.1.0 Open Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/aegis-410-open-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AAR_URL: https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar
      AAR_SHA256: a6b51b525b72a114c10e34288392439b1897c9ff7ce2f8afd7ffdce9d91e93b3
    steps:
      - name: Checkout public build repo
        uses: actions/checkout@v4

      - name: Validate private-source token
        shell: bash
        env:
          AEGIS_SOURCE_TOKEN: ${{ secrets.AEGIS_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AEGIS_SOURCE_TOKEN:-}"

      - name: Checkout private Aegis source
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidVPN-Android
          token: ${{ secrets.AEGIS_SOURCE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          rm -rf work && mkdir work
          unzip -q SaeidVPN-Android-3.2.0-final-source.zip -d work
          PROJECT_DIR="$(find work -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/private-source/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply Aegis Shield 4.1.0 patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/private-source/ci/prebuild-base.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/fix-lint-errors.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc2-runtime-fixes.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc3-smart-fallback.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc4-aegis-ui-runtime.py"
          python3 "$GITHUB_WORKSPACE/private-source/.github/support/fix-ui-smoke.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc5-private-advanced-argo-import.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc6-professional-dashboard-argo-choice.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc6b-wire-argo-choice-activity.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc7-argo-import-feedback.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc8-runtime-fast-connect.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc9-adaptive-orchestrator-branding.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc10-argo-reachability-feedback.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc11-smart-route-shortlist.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc12-live-route-selection-hotfix.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc13-zero-delay-shortlist-privacy.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc15-app-routing-adult-filter.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc16-android-auto-bypass-hotfix.py"
          python3 "$GITHUB_WORKSPACE/private-source/ci/rc17-live-policy-stable-protocol-pool.py"
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisArgoChoiceUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisArgoChoiceUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisArgoImportFeedbackUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisArgoImportFeedbackUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisOrchestratorUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisOrchestratorUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisArgoReachabilityUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisArgoReachabilityUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisZeroDelayRouteUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisZeroDelayRouteUiTest.kt
          cp "$GITHUB_WORKSPACE/private-source/.github/support/AegisProtectionUiTest.kt" app/src/androidTest/java/com/v2ray/ang/ui/main/AegisProtectionUiTest.kt

      - name: Install verified Xray core
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-all-errors --output app/libs/libv2ray.aar "$AAR_URL"
          echo "$AAR_SHA256  app/libs/libv2ray.aar" | sha256sum --check --strict

      - name: Build and package HEV tun2socks JNI
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash "$GITHUB_WORKSPACE/private-source/ci/build-hev-tunnel.sh"

      - name: Verify 4.1.0 live-policy and protocol contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          check() { printf 'CHECK %-44s ' "$1"; shift; "$@"; echo OK; }
          check version-name grep -q 'versionName = "4.1.0"' app/build.gradle.kts
          check version-code grep -q 'versionCode = 46' app/build.gradle.kts
          check in-place-core-reload grep -q 'fun reloadCoreInPlace(): Boolean' app/src/main/java/com/v2ray/ang/core/CoreServiceManager.kt
          check route-cooldown grep -q 'routeCooldownDurationMs = 120_000L' app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          check health-hysteresis grep -q 'val requiredFailures = if (dwellMs < 45_000L) 4 else 3' app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          check slower-health-cadence grep -q 'delay(25_000L)' app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          check confirm-retry grep -q 'delay(5_000L)' app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          check protocol-neutral-score grep -q 'val priorityPenalty = 0L' app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          check native-vless grep -q 'const val VLESS = "vless"' app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt
          check native-wireguard grep -q 'const val WIREGUARD = "wireguard"' app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt
          check native-hysteria grep -q 'const val HYSTERIA2 = "hysteria2"' app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt
          check native-trojan grep -q 'const val TROJAN = "trojan"' app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt
          check native-vmess grep -q 'const val VMESS = "vmess"' app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt
          check native-shadowsocks grep -q 'const val SHADOWSOCKS = "shadowsocks"' app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt
          check native-socks grep -q 'const val SOCKS = "socks"' app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt
          check native-http grep -q 'const val HTTP = "http"' app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt
          check custom-xray grep -q 'const val CUSTOM = "custom"' app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt
          check five-route-cap grep -q '.take(5)' app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          check app-bypass-engine grep -q 'addDisallowedApplication' app/src/main/java/com/v2ray/ang/service/CoreVpnService.kt
          check app-allow-engine grep -q 'addAllowedApplication' app/src/main/java/com/v2ray/ang/service/CoreVpnService.kt
          check android-auto grep -q 'com.google.android.projection.gearhead' app/src/main/java/com/v2ray/ang/service/CoreVpnService.kt
          python3 - <<'PY'
          from pathlib import Path
          vm = Path('app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt').read_text()
          core = Path('app/src/main/java/com/v2ray/ang/core/CoreServiceManager.kt').read_text()
          contract = Path('app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt').read_text()

          a = vm.index('    fun setAdultContentBlocked(blocked: Boolean) {')
          b = vm.index('\n    fun userRequestedDisconnect()', a)
          adult = vm[a:b]
          assert 'PREF_REMOTE_DNS' in adult
          assert 'PREF_LOCAL_DNS_ENABLED' in adult
          assert 'PREF_VPN_DNS' not in adult, 'Adult toggle must not rebuild Android VPN DNS in 4.1'
          assert 'reloadSelectedCoreInPlace' in adult
          assert 'MSG_STATE_STOP' in adult, 'full reconnect must remain only as reload failure fallback'

          s = vm.index('    fun selectSmartRoute(guid: String) {')
          e = vm.index('\n    fun selectAutomaticRoute()', s)
          route = vm[s:e]
          assert 'reloadSelectedCoreInPlace' in route

          assert 'fun reloadCoreInPlace(): Boolean = reloadCore()' in core
          assert 'priorityPenalty = 0L' in vm
          assert 'delay + rank * 5L' not in vm
          assert 'verified -> (rank * 10L' not in vm

          native_block = contract[contract.index('    val nativeProfiles = setOf('):]
          for protocol in ('VLESS','WIREGUARD','HYSTERIA2','TROJAN','VMESS','SHADOWSOCKS','SOCKS','HTTP','CUSTOM'):
              assert protocol in native_block, protocol
          print('Aegis 4.1 live-policy/stability/protocol-neutral contract verified')
          PY
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            check "hev-$abi" test -s "app/libs/$abi/libhev-socks5-tunnel.so"
          done

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testPlaystoreDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintPlaystoreDebug

      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assemblePlaystoreDebug

      - name: Static APK integrity checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/verify_apk.py
          UNIVERSAL="$(find app/build/outputs/apk/playstore/debug -name '*universal.apk' -print -quit)"
          test -n "$UNIVERSAL"
          python3 - "$UNIVERSAL" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          required = {
              'lib/arm64-v8a/libhev-socks5-tunnel.so',
              'lib/armeabi-v7a/libhev-socks5-tunnel.so',
              'lib/x86_64/libhev-socks5-tunnel.so',
              'lib/x86/libhev-socks5-tunnel.so',
          }
          with zipfile.ZipFile(apk) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit('Missing HEV JNI entries: ' + ', '.join(missing))
          print('HEV JNI verified for all shipping ABIs')
          PY

      - name: Free runner disk and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          df -h /

      - name: Android 16 instrumentation and cold launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim
          script: |
            bash -lc 'set -euo pipefail; cd "$PROJECT_DIR"; chmod +x gradlew; ./gradlew --no-daemon connectedPlaystoreDebugAndroidTest; bash scripts/android16_cold_launch_test.sh'

      - name: Prepare final APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-files"
          ARM64="$(find "$PROJECT_DIR/app/build/outputs/apk/playstore/debug" -name '*arm64-v8a.apk' -print -quit)"
          UNIVERSAL="$(find "$PROJECT_DIR/app/build/outputs/apk/playstore/debug" -name '*universal.apk' -print -quit)"
          test -n "$ARM64"
          test -n "$UNIVERSAL"
          cp "$ARM64" "$GITHUB_WORKSPACE/release-files/Aegis-Shield-VPN-4.1.0-ARM64.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/release-files/Aegis-Shield-VPN-4.1.0-Universal.apk"
          cd "$GITHUB_WORKSPACE/release-files"
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload final tested APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Shield-Android-4.1.0-final-tested
          path: |
            release-files/Aegis-Shield-VPN-4.1.0-ARM64.apk
            release-files/Aegis-Shield-VPN-4.1.0-Universal.apk
            release-files/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
